name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Verify PostgreSQL client
        run: psql --version
      - name: Unit suite
        run: npm test -- --silent --maxWorkers=2
      - name: WelaPLUS assessment-questions type check
        run: npm run test:types
      - name: Shared EGRA content pack is unchanged
        run: npm run test:content
      - name: PostgreSQL history-authorization suite
        env:
          HISTORY_RLS_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          HISTORY_RLS_DATABASE_NAME: masi_history_rls_ci
          HISTORY_RLS_DISPOSABLE_CONFIRM: I_UNDERSTAND_THIS_IS_DISPOSABLE
        run: npm run verify:history-authorization:postgres
      - name: Upload contract PostgreSQL harness (S1)
        env:
          HISTORY_RLS_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          HISTORY_RLS_DATABASE_NAME: masi_history_rls_ci
          HISTORY_RLS_DISPOSABLE_CONFIRM: I_UNDERSTAND_THIS_IS_DISPOSABLE
        run: npm run verify:upload-contract:postgres
      - name: Organisation label PostgreSQL harness
        env:
          PGTZ: UTC
          HISTORY_RLS_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          HISTORY_RLS_DATABASE_NAME: masi_history_rls_ci
          HISTORY_RLS_DISPOSABLE_CONFIRM: I_UNDERSTAND_THIS_IS_DISPOSABLE
        run: npm run verify:organisation-label:postgres
      - name: Support-incident PostgreSQL harness (S2)
        env:
          PGTZ: UTC
          HISTORY_RLS_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          HISTORY_RLS_DATABASE_NAME: masi_history_rls_ci
          HISTORY_RLS_DISPOSABLE_CONFIRM: I_UNDERSTAND_THIS_IS_DISPOSABLE
        run: npm run verify:support-incident:postgres
      - name: Assessment results PostgreSQL harness
        env:
          PGTZ: UTC
          HISTORY_RLS_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          HISTORY_RLS_DATABASE_NAME: masi_history_rls_ci
          HISTORY_RLS_DISPOSABLE_CONFIRM: I_UNDERSTAND_THIS_IS_DISPOSABLE
        run: npm run verify:assessment-results:postgres
      - name: Assessment history PostgreSQL harness
        env:
          PGTZ: UTC
          HISTORY_RLS_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          HISTORY_RLS_DATABASE_NAME: masi_history_rls_ci
          HISTORY_RLS_DISPOSABLE_CONFIRM: I_UNDERSTAND_THIS_IS_DISPOSABLE
        run: npm run verify:assessment-history:postgres
      - name: EA access suspension PostgreSQL harness
        env:
          PGTZ: UTC
          HISTORY_RLS_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          HISTORY_RLS_DATABASE_NAME: masi_history_rls_ci
          HISTORY_RLS_DISPOSABLE_CONFIRM: I_UNDERSTAND_THIS_IS_DISPOSABLE
        run: npm run verify:ea-access:postgres
      - name: Letter mastery PostgreSQL harness
        env:
          PGTZ: UTC
          HISTORY_RLS_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          HISTORY_RLS_DATABASE_NAME: masi_history_rls_ci
          HISTORY_RLS_DISPOSABLE_CONFIRM: I_UNDERSTAND_THIS_IS_DISPOSABLE
        run: npm run verify:letter-mastery:postgres
      - name: Session group PostgreSQL harness (B2)
        env:
          PGTZ: UTC
          HISTORY_RLS_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          HISTORY_RLS_DATABASE_NAME: masi_history_rls_ci
          HISTORY_RLS_DISPOSABLE_CONFIRM: I_UNDERSTAND_THIS_IS_DISPOSABLE
        run: npm run verify:session-group:postgres
      - name: Letter order PostgreSQL harness
        env:
          PGTZ: UTC
          HISTORY_RLS_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          HISTORY_RLS_DATABASE_NAME: masi_history_rls_ci
          HISTORY_RLS_DISPOSABLE_CONFIRM: I_UNDERSTAND_THIS_IS_DISPOSABLE
        run: npm run verify:letter-order:postgres
      - name: Website reporting PostgreSQL harness
        env:
          PGTZ: UTC
          MASI_REPORTING_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          MASI_REPORTING_DATABASE_NAME: masi_history_rls_reporting_ci
          MASI_REPORTING_DISPOSABLE_CONFIRM: I_UNDERSTAND_THIS_IS_DISPOSABLE
        run: npm run verify:reporting:postgres
      - name: Integration suite (file-backed SQLite)
        run: npm run test:integration
