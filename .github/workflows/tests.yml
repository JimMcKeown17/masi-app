name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Unit suite
        run: npm test -- --silent --maxWorkers=2
      - name: Integration suite (file-backed SQLite)
        run: npm run test:integration
